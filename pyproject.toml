[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxlab-ads-wasted-spend"
version = "1.0.0"
description = "Audyt zmarnowanego budzetu Google Ads + skrypt-straznik (FluxLab)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fluxlab-ads = "fluxlab_ads.cli:main"

[tool.setuptools]
packages = ["fluxlab_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
